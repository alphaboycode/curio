  <line x1="160" y1="160" x2="340" y2="160" stroke="#0c5b73" stroke-width="2" opacity="0.6"/>
  <line x1="180" y1="300" x2="320" y2="300" stroke="#0c5b73" stroke-width="2" opacity="0.6"/>
  <!-- glowing eyes -->
  <polygon points="195,210 215,225 195,245 180,225" fill="#ffffff"/>
  <polygon points="305,210 285,225 305,245 320,225" fill="#ffffff"/>
