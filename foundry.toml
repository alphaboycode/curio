[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
